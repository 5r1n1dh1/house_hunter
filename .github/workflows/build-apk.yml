name: Build Production APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  # `write` is required for `gh release create`; with `read` the tag-build's
  # release step failed and every APK stopped at "artifact only".
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint & release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      GRADLE_VERSION: "8.10.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK (preinstalled on the runner)
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $SDK/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          "$SDKMANAGER" --list_installed | head -15

      - name: Bootstrap Gradle (wrapper JAR is not committed)
        run: |
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle (dependency cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin --no-daemon

      - name: Unit tests & lint
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon --stacktrace

      # Gradle prints nothing for passing tests, so a green run cannot be told apart
      # from "no tests ran". Summarise the JUnit XML explicitly.
      - name: Test summary
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = failed = errors = skipped = 0
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0))
              failed += int(r.get("failures", 0))
              errors += int(r.get("errors", 0))
              skipped += int(r.get("skipped", 0))
          print(f"tests: {total} | failures: {failed} | errors: {errors} | skipped: {skipped}")
          if total == 0:
              raise SystemExit("::error::no unit tests were executed")
          PY

      # The secrets-gradle-plugin injects `${MAPS_API_KEY}` into the manifest by
      # reading `.env`, which is gitignored and therefore absent on the runner.
      # Without this the plugin silently falls back to the `your-google-maps-api-key`
      # placeholder in `.env.example`: `BuildConfig` looked correct, but the manifest
      # the Maps SDK actually reads was the dummy, so the map failed at runtime.
      - name: Materialise .env for the secrets plugin
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MAPS_API_KEY:-}" ]; then
            echo "::warning::MAPS_API_KEY secret is empty - maps will be disabled in this build"
          fi
          printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY" > .env
          echo "wrote .env (value not echoed)"

      - name: Assemble release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      # Proves the key reached the merged manifest rather than the placeholder.
      # A silent regression here is invisible: the app builds, then the map is blank.
      - name: Verify the Maps key reached the merged manifest
        run: |
          set -euo pipefail
          # The intermediates path is AGP-version dependent, so locate the manifest
          # instead of hardcoding it - a wrong guess must not read as "missing key".
          MERGED=$(find app/build/intermediates -path '*merged_manifest*' \
            -name AndroidManifest.xml 2>/dev/null | head -1 || true)
          if [ -z "$MERGED" ]; then
            echo "::warning::no merged manifest found; skipping the Maps key check"
            exit 0
          fi
          echo "checking $MERGED"
          if grep -q 'your-google-maps-api-key' "$MERGED"; then
            echo "::error::merged manifest still contains the placeholder Maps key"
            exit 1
          fi
          if ! grep -q 'com.google.android.geo.API_KEY' "$MERGED"; then
            echo "::error::Maps API_KEY meta-data missing from the merged manifest"
            exit 1
          fi
          echo "Maps key present in merged manifest"

      - name: Align & sign APK
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          DIR=app/build/outputs/apk/release
          UNSIGNED="$DIR/app-release-unsigned.apk"
          OUT="$DIR/app-release.apk"
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore.jks
            "$BT"/zipalign -f -v 4 "$UNSIGNED" app-aligned.apk
            "$BT"/apksigner sign --ks keystore.jks \
              --ks-pass "pass:$SIGNING_KEYSTORE_PASSWORD" \
              --key-pass "pass:$SIGNING_KEY_PASSWORD" \
              --ks-key-alias "$SIGNING_KEY_ALIAS" --out "$OUT" app-aligned.apk
            "$BT"/apksigner verify --verbose "$OUT"
          else
            "$BT"/zipalign -f -v 4 "$UNSIGNED" "$OUT"
            echo "::warning::No signing secrets configured - artifact is unsigned"
          fi
          ls -lh "$OUT"
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

      # Every successful build on main is published as an installable release so
      # the APK is reachable from Releases rather than only from the run page.
      - name: Publish release (auto-tag on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::no APK to publish"; exit 1; }

          # Git identity is required for annotated tags.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Next patch version after the highest existing vX.Y.Z tag.
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
          if [ -n "$latest" ]; then
            base="${latest#v}"
            major="${base%%.*}"; rest="${base#*.}"
            minor="${rest%%.*}"; patch="${rest##*.}"
            TAG="v$major.$minor.$((patch + 1))"
          else
            TAG="v1.0.0"
          fi

          # Re-runs must not collide with a tag this job already created.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refreshing its release instead."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          NOTES=$(cat <<EOF
          Install: download \`app-release.apk\` and open it (enable "install from unknown sources" if prompted).

          - Sources: NoBroker, MagicBricks, 99acres, Razorent, Stanza Living, Bengaluru.rent
          - Sources are scraped in parallel and results appear as each one loads
          - Distances are marked \`~\` when the site only publishes an area, not an exact pin
          EOF
          )
          gh release create "$TAG" "$APK" \
            --title "House Hunter $TAG" \
            --notes "$NOTES" || gh release upload "$TAG" "$APK" --clobber
          echo "Published $TAG"